[project]
name = "crypto-alerts-fastapi-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
    "shared",
    "ingestor",
    "notifier",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
src = ["backend/src", "shared/src", "ingestor/src", "notifier/src"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "I", # isort — import ordering
    "UP", # pyupgrade — modern syntax
    "B", # bugbear — likely bugs
    "SIM", # simplify
    "ASYNC", # async pitfalls: blocking calls in async code
    "RUF", # ruff-specific
    "G",
]

[tool.ruff.lint.per-file-ignores]
"backend/src/backend/alembic/versions/*" = ["E501"]

[tool.pytest]
testpaths = ["shared/tests", "backend/tests", "ingestor/tests", "notifier/tests"]
addopts = [
    "-ra",
    #"-q",
    "-vv",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# importlib mode names test modules after their path (shared.tests.test_events)
# and would register a stub `shared` parent that shadows the real package —
# this makes pytest resolve package roots through sys.path instead
consider_namespace_packages = true
markers = [
    "integration: requires docker (testcontainers)",
]
