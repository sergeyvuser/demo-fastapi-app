[project]
name = "crypto-alerts-fastapi-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
    "shared",
    "ingestor",
    "notifier",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "testcontainers>=4.15.0",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["backend/src", "shared/src", "ingestor/src", "notifier/src"]
# faststream/taskiq/testcontainers тянут пакеты без аннотаций
ignore_missing_imports = true
# гигиена: ignore, ставший ненужным, должен ломать сборку, а не гнить
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# shared — контракт между сервисами, здесь требуем аннотации везде
module = "shared.*"
disallow_untyped_defs = true

[tool.ruff]
target-version = "py314"
src = ["backend/src", "shared/src", "ingestor/src", "notifier/src"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "I", # isort — import ordering
    "UP", # pyupgrade — modern syntax
    "B", # bugbear — likely bugs
    "SIM", # simplify
    "ASYNC", # async pitfalls: blocking calls in async code
    "RUF", # ruff-specific
    "G",
]

[tool.ruff.lint.per-file-ignores]
"backend/src/backend/alembic/versions/*" = ["E501"]

[tool.pytest]
testpaths = ["tests", "shared/tests", "backend/tests", "ingestor/tests", "notifier/tests"]
addopts = [
    "-ra",
    #"-q",
    "-vv",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"

# both scopes must match: fixtures create the engine and its connections,
# tests await on them — split scopes put them on different event loops
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# importlib mode names test modules after their path (shared.tests.test_events)
# and would register a stub `shared` parent that shadows the real package —
# this makes pytest resolve package roots through sys.path instead
consider_namespace_packages = true
markers = [
    "integration: requires docker (testcontainers or the compose CLI)",
]
