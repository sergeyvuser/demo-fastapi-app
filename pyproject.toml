[project]
name = "crypto-alerts-fastapi-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
src = ["backend/src"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "I", # isort — import ordering
    "UP", # pyupgrade — modern syntax
    "B", # bugbear — likely bugs
    "SIM", # simplify
    "ASYNC", # async pitfalls: blocking calls in async code
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"backend/src/backend/alembic/versions/*" = ["E501"]