name: crypto-alerts

x-app-env: &app-env
  APP_CONFIG__LOG__JSON_FORMAT: "1"
  APP_CONFIG__DB__SQLA__ECHO: "0"
  APP_CONFIG__DB__HOST: db
  APP_CONFIG__REDIS__HOST: redis
  APP_CONFIG__RABBITMQ__HOST: rabbitmq
  # mailpit only runs under the `tools` profile; a deployment overrides this block
  # with an overlay file, not through .env (this `environment:` wins over env_file)
  APP_CONFIG__SMTP__HOST: mailpit
  APP_CONFIG__OTEL__ENDPOINT: "http://jaeger:4317"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${APP_CONFIG__DB__NAME}
      POSTGRES_USER: ${APP_CONFIG__DB__USERNAME}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD:?set APP_CONFIG__DB__PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USERNAME} -d ${APP_CONFIG__DB__NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_CONFIG__DB__HOST: db
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_CONFIG__RABBITMQ__USERNAME}
      RABBITMQ_DEFAULT_PASS: ${APP_CONFIG__RABBITMQ__PASSWORD:?set APP_CONFIG__RABBITMQ__PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.6
    profiles: [ tools ]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP — сюда приложение шлёт письма
      - "127.0.0.1:8025:8025"   # Web UI — здесь ты их читаешь
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    profiles: [ tools ]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # dashboard schema v2 (feature-flagged, on by default in 13.x) does not
      # survive a round-trip: Grafana exports panels the file provisioner then
      # rejects field by field. Classic schema is what provisioning supports.
      GF_FEATURE_TOGGLES_dashboardNewLayouts: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"   # ring buffer instead of unbounded growth
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC receiver

  # Per-container metrics: memory split into anonymous and cache, CPU, and the
  # moment each container last started. This is the answer to "why did that
  # container restart", which until now lived only in the kernel log behind sudo.
  #
  # It publishes no ports: Prometheus reaches it by service name inside the
  # compose network, exactly like every other target in observability/prometheus.yml.
  #
  # The mounts are the upstream recipe and they are not decoration:
  #   /rootfs, /sys      — the cgroup and sysfs trees where the kernel keeps the
  #                        per-container accounting this whole service exists to read
  #   /var/run           — the Docker socket. Without it cAdvisor still reads
  #                        cgroups but cannot map them to container names, which
  #                        makes every metric anonymous and useless to us
  #   /var/lib/docker    — image and layer sizes
  #   /dev/disk          — block device names for disk I/O
  # Read-only throughout, but read access to the Docker socket is still a real
  # privilege: it can enumerate and inspect every container on the host.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    command:
      # A keep-list, not a drop-list, and deliberately so: --disable_metrics
      # ships with a non-empty default (advtcp, sched, tcp, udp, process and
      # six more), and passing our own value would REPLACE that default rather
      # than extend it — quietly switching ten families on while we thought we
      # were switching families off. --enable_metrics overrides it outright.
      #
      #   cpu       — rate of CPU seconds per container
      #   memory    — the point of this ticket: anonymous vs cache, and the limit
      #   oom_event — container_oom_events_total, i.e. the kill that ticket 09
      #               could only find in the kernel log behind sudo
      #   pressure  — PSI: how long this container's processes spent stalled
      #               waiting for memory, CPU or IO. Cheap, and it answers
      #               "was it struggling" without inferring it from percentages.
      #
      # Left out on purpose: disk and diskIO were 45% of everything scraped here
      # (seventeen container_fs_* names, ~2200 series) and node-exporter owns
      # the disk story; network is not plotted anywhere; cpuLoad is another 312
      # series of load averages nobody reads.
      - --enable_metrics=cpu,memory,oom_event,pressure
      # Report containers, not every cgroup on the machine. Measured: 52 cgroups
      # were being reported where this project has fifteen containers.
      - --docker_only=true
      # The root cgroup is the whole machine, and the whole machine is
      # node-exporter's job. Two sources for one number is a drift generator.
      - --disable_root_cgroup_stats=true
      # Default is true, whatever the website says. Left on, every metric carries
      # ~25 container_label_* pairs, three of which — config_hash, image digest
      # and the container id — change on every deploy. Since a time series is
      # identified by its full label set, that does not update the series, it
      # creates a new one: every release would multiply the cAdvisor series
      # count. It also published the absolute path of the compose file, which a
      # public anonymous Grafana has no business showing.
      - --store_container_labels=false
      # Default is 1s against a 30s scrape: twenty-nine of every thirty
      # collections were thrown away. Matched to the scrape interval instead.
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # The kernel ring buffer, which is where an OOM kill is announced. This is
    # the same log ticket 09 had to read by hand over ssh.
    devices:
      - /dev/kmsg:/dev/kmsg

  # Host metrics: memory, swap activity, disk space, CPU, load average.
  #
  # Deliberately NOT the upstream compose recipe, which asks for
  # `network_mode: host` and `pid: host`. Host networking would put this on the
  # machine's own interfaces — a published port in all but name — and take it
  # off the compose network, where Prometheus finds targets by name.
  #
  # What that costs is the network collectors: netdev, netstat and sockstat then
  # describe this container's network namespace rather than the machine's.
  # Everything this ticket actually asks for — meminfo, vmstat, loadavg,
  # /proc/stat, filesystems — is not namespaced per container and stays true.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      # Forty-nine collectors run by default. Rather than name the forty-two we
      # do not want — a list that goes stale with every release — switch them
      # all off and name the seven we plot.
      - --collector.disable-defaults
      - --collector.meminfo      # host memory: total, available, swap totals
      - --collector.vmstat       # swap in/out, and node_vmstat_oom_kill, which
      # is the kernel's own count of OOM kills
      - --collector.pressure     # host-wide PSI, the counterpart to cAdvisor's
      - --collector.filesystem   # disk space; 60 GB and thirteen containers
      - --collector.cpu
      - --no-collector.cpu.guest # virtualisation guest time: 24 series, and
      # this host runs no guests
      - --collector.loadavg
      - --collector.stat         # boot time, context switches, runnable procs
    # Mount propagation is added by the production overlay, not set here.
    # Docker Desktop rejects it outright — the WSL2 VM's root is a private
    # mount, and the daemon answers "path / is mounted on / but it is not a
    # shared or slave mount". On the server systemd makes / rshared at boot.
    # A laptop can live with a snapshot of the mount table; see the overlay
    # for why a machine that deploys cannot.
    volumes:
      - /:/host:ro

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      <<: *app-env                                        # merge shared block
      APP_CONFIG__RUN__HOST: 0.0.0.0                      # plus service-specific
      APP_CONFIG__RUN__RELOAD: "0"
      APP_CONFIG__RUN__PUBLIC_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: backend/src
          target: /app/backend/src
        - action: rebuild
          path: backend/pyproject.toml
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')" ]
      interval: 10s
      timeout: 3s
      retries: 5

  evaluator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [ "faststream", "run", "backend.consumers.app:app" ]
    env_file: .env
    environment:
      <<: *app-env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    env_file: .env
    environment:
      <<: *app-env
      APP_CONFIG__OTEL__SAMPLE_RATIO: "1.0" # trace every tick locally: volume is low
      # and complete tick→alert chains are the point
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
    env_file: .env
    environment:
      <<: *app-env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: [ "taskiq", "worker", "backend.tasks.worker:broker",
               "backend.tasks.email", "backend.tasks.maintenance", "backend.tasks.digest" ]
    env_file: .env
    environment:
      <<: *app-env
      APP_CONFIG__RUN__PUBLIC_URL: http://127.0.0.1:8000
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      # no mailpit here on purpose: depending on a profiled service would make the
      # stack unstartable without that profile

  scheduler:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: [ "taskiq", "scheduler", "backend.tasks.worker:scheduler",
               "backend.tasks.maintenance", "backend.tasks.digest" ]
    env_file: .env
    environment:
      <<: *app-env
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }

volumes:
  pg_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
