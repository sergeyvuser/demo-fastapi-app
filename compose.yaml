name: crypto-alerts

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${APP_CONFIG__DB__NAME}
      POSTGRES_USER: ${APP_CONFIG__DB__USERNAME}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USERNAME} -d ${APP_CONFIG__DB__NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_CONFIG__RABBITMQ__USERNAME}
      RABBITMQ_DEFAULT_PASS: ${APP_CONFIG__RABBITMQ__PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_CONFIG__DB__HOST: db
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_CONFIG__DB__HOST: db
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
      APP_CONFIG__SMTP__HOST: mailpit
      APP_CONFIG__RUN__HOST: 0.0.0.0
      APP_CONFIG__RUN__RELOAD: "0"
      APP_CONFIG__RUN__PUBLIC_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: backend/src
          target: /app/backend/src
        - action: rebuild
          path: backend/pyproject.toml
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')" ]
      interval: 10s
      timeout: 3s
      retries: 5

  evaluator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [ "faststream", "run", "backend.consumers.app:app" ]
    env_file: .env
    environment:
      APP_CONFIG__DB__HOST: db
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    env_file: .env
    environment:
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
    env_file: .env
    environment:
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
      APP_CONFIG__REDIS__HOST: redis
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: [ "taskiq", "worker", "backend.tasks.broker:broker",
               "backend.tasks.email", "backend.tasks.maintenance", "backend.tasks.digest" ]
    env_file: .env
    environment:
      APP_CONFIG__DB__HOST: db
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
      APP_CONFIG__SMTP__HOST: mailpit
      APP_CONFIG__RUN__PUBLIC_URL: http://127.0.0.1:8000
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: [ "taskiq", "scheduler", "backend.tasks.broker:scheduler",
               "backend.tasks.maintenance", "backend.tasks.digest" ]
    env_file: .env
    environment:
      APP_CONFIG__RABBITMQ__HOST: rabbitmq
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP — сюда приложение шлёт письма
      - "127.0.0.1:8025:8025"   # Web UI — здесь ты их читаешь
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    profiles: [ tools ]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"    # dev: без логина
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pg_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data: