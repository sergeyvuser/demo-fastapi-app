# Production overlay, applied on top of the development compose file:
#
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml \
#     --env-file .env --env-file .env.secrets up -d
#
# Two things that look alike and are not:
#   * `--env-file` feeds ${...} substitution inside these YAML files;
#   * `env_file:` feeds the environment of a container.
# Infrastructure images take their credentials through substitution, the
# application takes its configuration through env_file — hence both.
#
# Relative paths resolve against the FIRST file, i.e. the repository root, so
# the server keeps the repository layout under /opt/alerts/.
#
# On the server both files sit next to compose.yaml in /opt/alerts/. In the
# repository they exist only as templates — deploy/.env.example and
# deploy/.env.secrets.example — which is what `make prod-config` and the test
# render against.
#
# `!reset` / `!override` must be written out per service: passing them through
# a YAML anchor silently drops the tag and the base value survives.

x-backend-image: &backend-image ghcr.io/sergeyvuser/demo-fastapi-app/backend:${IMAGE_TAG:?}
x-ingestor-image: &ingestor-image ghcr.io/sergeyvuser/demo-fastapi-app/ingestor:${IMAGE_TAG:?}
x-notifier-image: &notifier-image ghcr.io/sergeyvuser/demo-fastapi-app/notifier:${IMAGE_TAG:?}

# Overrides of the base x-app-env block. `environment:` wins over `env_file:`,
# so anything the base pins to a laptop value must be pinned again here.
x-prod-env: &prod-env
  APP_CONFIG__SMTP__HOST: smtp.resend.com
  APP_CONFIG__SMTP__PORT: "465"
  APP_CONFIG__SMTP__SECURITY: tls
  APP_CONFIG__SMTP__USERNAME: resend        # a literal, not the account name
  APP_CONFIG__SMTP__SENDER: "Crypto Alerts <alerts@vorobev.dev>"
  APP_CONFIG__RUN__PUBLIC_URL: https://alerts.vorobev.dev

services:
  db:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128M } } }

  rabbitmq:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # One-shot: every application service waits for it to exit 0. Deliberately
  # without `restart` — a restarting migration would deadlock the stack.
  migrate:
    image: *backend-image
    build: !reset null
    # both optional: the configuration must render without secrets, which is
    # what the test does and what CI has. Written out per service — a tag on an
    # alias node is a YAML syntax error, and a tag inside the anchor body is
    # silently dropped when the alias is expanded.
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    deploy: { resources: { limits: { memory: 320M } } }

  api:
    image: *backend-image
    build: !reset null
    develop: !reset { }
    ports: !reset [ ]            # Caddy is the only published service (ticket 06)
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
      # Both internal names are load-bearing, and neither is reachable from
      # outside: Caddy only forwards the two public hostnames, so no client can
      # put "api" or "127.0.0.1" in a Host header that reaches this service.
      #   127.0.0.1 — the container healthcheck calls itself by IP, and
      #               TrustedHostMiddleware would answer it 400 forever;
      #   api       — the name Prometheus scrapes by. The middleware compares
      #               Host before routing, so without this every scrape of
      #               /metrics is a 400 and the API has no metrics at all.
      APP_CONFIG__RUN__ALLOWED_HOSTS: '["alerts.vorobev.dev","127.0.0.1","api"]'
      # Not "*": with a wildcard granian trusts the FIRST X-Forwarded-For entry,
      # which is whatever the client sent, and per-IP rate limiting becomes
      # opt-out. With a subnet it walks right to left and returns the first
      # address outside it — the real client as Caddy saw it.
      APP_CONFIG__RUN__TRUSTED_PROXIES: '["172.16.0.0/12"]'
    deploy: { resources: { limits: { memory: 384M } } }

  evaluator:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    deploy: { resources: { limits: { memory: 320M } } }

  worker:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 320M } } }

  scheduler:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  ingestor:
    image: *ingestor-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
      # Inherited from the base file, restated here so it is a decision rather
      # than a laptop value that leaked: head sampling happens at the start of
      # the chain, so anything below 1.0 loses most tick→alert→notify traces —
      # the one thing worth showing here. Two symbols at a few ticks a second
      # fill Jaeger's 10 000-trace buffer in tens of minutes; if that window
      # proves too short, raise MEMORY_MAX_TRACES rather than lower this.
      APP_CONFIG__OTEL__SAMPLE_RATIO: "1.0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  notifier:
    image: *notifier-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  prometheus:
    ports: !reset [ ]
    restart: unless-stopped
    # Overriding `command` drops the image's default arguments, so the config
    # path and the data path have to be restated. The legacy console templates
    # are not restated on purpose — nothing uses them.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    deploy: { resources: { limits: { memory: 384M } } }

  grafana:
    ports: !reset [ ]
    restart: unless-stopped
    environment:
      # Public and read-only: anonymous Viewer, no sign-up, and Explore off —
      # with Explore an anonymous visitor runs arbitrary PromQL against the
      # unexposed Prometheus. The admin password stays required (base file).
      GF_SERVER_ROOT_URL: https://grafana.vorobev.dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_EXPLORE_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    deploy: { resources: { limits: { memory: 256M } } }

  jaeger:
    ports: !reset [ ]
    restart: unless-stopped
    environment:
      MEMORY_MAX_TRACES: "10000"   # half the local ring buffer: 4 GB host
    deploy: { resources: { limits: { memory: 384M } } }

  # The only service that publishes anything, and the only one that exists in
  # production alone. Deliberately without depends_on: if the API is broken the
  # door still has to open. ACME validation, Grafana and the 404 page do not
  # need the application, and a certificate that cannot be renewed during an
  # outage turns one incident into two.
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      # No 127.0.0.1 prefix, unlike every port in the development file: this is
      # the one place that is meant to be reachable from the internet.
      - "80:80"          # ACME HTTP challenge, and the redirect to HTTPS
      - "443:443"
      - "443:443/udp"    # HTTP/3, which Caddy advertises via Alt-Svc anyway
    environment:
      # No env_file here on purpose: the door has no business holding the
      # database password or the bot token.
      ACME_EMAIL: ${ACME_EMAIL:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Lose this volume and every
      # container recreation asks for fresh certificates, straight into the
      # duplicate-certificate rate limit.
      - caddy_data:/data
      - caddy_config:/config
    deploy: { resources: { limits: { memory: 128M } } }

volumes:
  caddy_data:
  caddy_config:
