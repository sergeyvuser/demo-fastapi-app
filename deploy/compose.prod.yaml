# Production overlay, applied on top of the development compose file:
#
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml \
#     --env-file .env --env-file .env.secrets up -d
#
# Two things that look alike and are not:
#   * `--env-file` feeds ${...} substitution inside these YAML files;
#   * `env_file:` feeds the environment of a container.
# Infrastructure images take their credentials through substitution, the
# application takes its configuration through env_file — hence both.
#
# Relative paths resolve against the FIRST file, i.e. the repository root, so
# the server keeps the repository layout under /opt/alerts/.
#
# On the server both files sit next to compose.yaml in /opt/alerts/. In the
# repository they exist only as templates — deploy/.env.example and
# deploy/.env.secrets.example — which is what `make prod-config` and the test
# render against.
#
# `!reset` / `!override` must be written out per service: passing them through
# a YAML anchor silently drops the tag and the base value survives.

x-backend-image: &backend-image ghcr.io/sergeyvuser/demo-fastapi-app/backend:${IMAGE_TAG:?}
x-ingestor-image: &ingestor-image ghcr.io/sergeyvuser/demo-fastapi-app/ingestor:${IMAGE_TAG:?}
x-notifier-image: &notifier-image ghcr.io/sergeyvuser/demo-fastapi-app/notifier:${IMAGE_TAG:?}

# Overrides of the base x-app-env block. `environment:` wins over `env_file:`,
# so anything the base pins to a laptop value must be pinned again here.
x-prod-env: &prod-env
  APP_CONFIG__SMTP__HOST: smtp.resend.com
  APP_CONFIG__SMTP__PORT: "465"
  APP_CONFIG__SMTP__SECURITY: tls
  APP_CONFIG__SMTP__USERNAME: resend        # a literal, not the account name
  APP_CONFIG__SMTP__SENDER: "Crypto Alerts <alerts@vorobev.dev>"
  APP_CONFIG__RUN__PUBLIC_URL: https://alerts.vorobev.dev

services:
  db:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128M } } }

  rabbitmq:
    ports: !reset [ ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # One-shot: every application service waits for it to exit 0. Deliberately
  # without `restart` — a restarting migration would deadlock the stack.
  migrate:
    image: *backend-image
    build: !reset null
    # both optional: the configuration must render without secrets, which is
    # what the test does and what CI has. Written out per service — a tag on an
    # alias node is a YAML syntax error, and a tag inside the anchor body is
    # silently dropped when the alias is expanded.
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    deploy: { resources: { limits: { memory: 320M } } }

  api:
    image: *backend-image
    build: !reset null
    develop: !reset { }
    ports: !reset [ ]            # Caddy is the only published service (ticket 06)
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
      # Both internal names are load-bearing, and neither is reachable from
      # outside: Caddy only forwards the two public hostnames, so no client can
      # put "api" or "127.0.0.1" in a Host header that reaches this service.
      #   127.0.0.1 — the container healthcheck calls itself by IP, and
      #               TrustedHostMiddleware would answer it 400 forever;
      #   api       — the name Prometheus scrapes by. The middleware compares
      #               Host before routing, so without this every scrape of
      #               /metrics is a 400 and the API has no metrics at all.
      APP_CONFIG__RUN__ALLOWED_HOSTS: '["alerts.vorobev.dev","127.0.0.1","api"]'
      # Not "*": with a wildcard granian trusts the FIRST X-Forwarded-For entry,
      # which is whatever the client sent, and per-IP rate limiting becomes
      # opt-out. With a subnet it walks right to left and returns the first
      # address outside it — the real client as Caddy saw it.
      APP_CONFIG__RUN__TRUSTED_PROXIES: '["172.16.0.0/12"]'
    # Raised as a stopgap, not as a fix. Measured in production: 170 MiB at
    # start, 321 MiB fifteen hours later, against a 384M limit — the only
    # service in the stack whose footprint moves at all, and on that trend the
    # next OOM kill was hours away. This buys observation time; the growth
    # itself is still unexplained and is tracked as its own piece of work.
    deploy: { resources: { limits: { memory: 512M } } }

  evaluator:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    deploy: { resources: { limits: { memory: 320M } } }

  worker:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Measured at 252 MiB idle in production — 79% of the 320M this used to
    # have, and the highest ratio in the stack, because this process imports
    # taskiq plus all three task modules. Idle is the wrong number to size a
    # limit against: the digest task fans out over rows, and the failure mode
    # of getting it wrong is a silent OOM kill mid-task, not a slow worker.
    deploy: { resources: { limits: { memory: 448M } } }

  scheduler:
    image: *backend-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  ingestor:
    image: *ingestor-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
      # Inherited from the base file, restated here so it is a decision rather
      # than a laptop value that leaked: head sampling happens at the start of
      # the chain, so anything below 1.0 loses most tick→alert→notify traces —
      # the one thing worth showing here. Two symbols at a few ticks a second
      # fill Jaeger's 10 000-trace buffer in tens of minutes; if that window
      # proves too short, raise MEMORY_MAX_TRACES rather than lower this.
      APP_CONFIG__OTEL__SAMPLE_RATIO: "1.0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  notifier:
    image: *notifier-image
    build: !reset null
    env_file: !override
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      <<: *prod-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy: { resources: { limits: { memory: 256M } } }

  prometheus:
    ports: !reset [ ]
    restart: unless-stopped
    # Overriding `command` drops the image's default arguments, so the config
    # path and the data path have to be restated. The legacy console templates
    # are not restated on purpose — nothing uses them.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      # Grafana is public and anonymous, and an anonymous visitor can run any
      # PromQL they like — see the note on the grafana service below. So the
      # query engine has to survive a hostile query, not merely our own, and
      # the default 50M samples is roughly 1.6 GiB of engine memory against a
      # 384M limit: a container that runs out of memory here is killed silently.
      #
      # The bound is measured against this deployment, not guessed. There are
      # 288 active series in total, 36 of them the latency histogram, scraped
      # every 10s:
      #   * heaviest real panel — p99 over the histogram across the full 7d
      #     retention — loads about 1.1M samples (30 per [5m] window x ~1000
      #     steps x 36 series); the raw range holds 2.2M;
      #   * a scan of every series over the same 7d is 17.4M samples, ~550 MiB,
      #     which is the query this cap exists to refuse.
      # 2M sits between the two with roughly 2x headroom over the real panel,
      # and bounds the engine at ~64 MiB per query, ~128 MiB across the two
      # concurrent slots. Exceeding it returns an explicit error instead of
      # killing the container, which is the entire point.
      #
      # Do not tighten this to a few hundred thousand: 150k would reject the
      # p99 panel at the dashboard's own default one-hour window (~259k).
      # The timeout is not the memory control and should not be raced to the
      # bottom either — today every panel answers in under a second, but on
      # fifteen hours of data, and two vCPUs have to serve nine panels every
      # ten seconds once the retention window actually fills.
      - --query.max-samples=2000000
      - --query.timeout=15s
      - --query.max-concurrency=2
    # The CPU ceiling is the other half of that story and the one the sample cap
    # cannot provide. max-concurrency=2 bounds Prometheus to two simultaneous
    # queries, but this host has two vCPUs, so "two queries" and "the whole
    # machine" are the same sentence: a bot looping cheap-but-not-free queries
    # through the public Grafana would starve the product without ever tripping
    # a memory or sample limit. Scraping 288 series every ten seconds costs
    # almost nothing, so half a core is generous for the real workload.
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }

  grafana:
    ports: !reset [ ]
    restart: unless-stopped
    environment:
      # Public and read-only: anonymous Viewer, no sign-up, Explore off. The
      # admin password stays required (base file).
      #
      # Explore off hides the query UI and nothing more — verified against this
      # deployment: an anonymous caller still gets a 200 from both
      # /api/datasources/proxy/uid/prometheus/... and /api/ds/query, and can run
      # any PromQL through either. The second one is how the panels themselves
      # fetch data, so it cannot be blocked at the proxy without blanking the
      # dashboard. Arbitrary reads are therefore inherent to anonymous Viewer,
      # and the toggle below must not be mistaken for a control.
      #
      # What actually makes that acceptable here: the metrics are deliberately
      # low-cardinality and carry no user identifiers, so there is nothing
      # private to read. What it does NOT make acceptable is an unbounded query
      # engine, which is why the prometheus service above caps samples, time and
      # concurrency. Restricting reads as well would mean dropping anonymous
      # auth for a shared-dashboard link — considered and declined in ticket 09:
      # the link would live in Grafana's volume rather than in this repository.
      GF_SERVER_ROOT_URL: https://grafana.vorobev.dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_EXPLORE_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    # OOM-killed at 256M seventeen minutes after the first production start,
    # while building its in-memory search index. The kernel counted 244 MiB of
    # anonymous memory plus 101 MiB of page cache: under cgroup v2 the file
    # cache counts towards the limit too, so a limit sized against the RSS you
    # see in `docker stats` is a limit sized too small.
    #
    # Capped on CPU as well: this is the front door to the query engine, and it
    # answers anonymously. See the note on the prometheus service above.
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }

  jaeger:
    ports: !reset [ ]
    restart: unless-stopped
    environment:
      # Measured, not guessed: 10000 traces of this shape cost ~370 MiB, and the
      # kernel killed this container at 367 MiB against a 384M limit after
      # fifteen hours. Ticks are sampled at 1.0 and arrive several a second, so
      # the buffer is the dominant consumer and it fills in about half an hour.
      #
      # An earlier note here advised raising this number rather than lowering
      # the ingestor's sample ratio if the trace window felt short. That advice
      # was wrong in production: raising it is what runs out of memory. The
      # honest fix for trace volume is tail-based sampling through an OTel
      # Collector — keep whole chains, drop the boring ones — which is a stage
      # decision, not a knob. Until then this is a demo-sized window of roughly
      # fifteen minutes, which is enough to click through a live trace.
      MEMORY_MAX_TRACES: "5000"
    # Ingest is roughly forty spans a second; the ceiling exists so that a burst
    # of tracing cannot compete with the product for two vCPUs.
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.3" }

  # The only service that publishes anything, and the only one that exists in
  # production alone. Deliberately without depends_on: if the API is broken the
  # door still has to open. ACME validation, Grafana and the 404 page do not
  # need the application, and a certificate that cannot be renewed during an
  # outage turns one incident into two.
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      # No 127.0.0.1 prefix, unlike every port in the development file: this is
      # the one place that is meant to be reachable from the internet.
      - "80:80"          # ACME HTTP challenge, and the redirect to HTTPS
      - "443:443"
      - "443:443/udp"    # HTTP/3, which Caddy advertises via Alt-Svc anyway
    environment:
      # No env_file here on purpose: the door has no business holding the
      # database password or the bot token.
      ACME_EMAIL: ${ACME_EMAIL:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Lose this volume and every
      # container recreation asks for fresh certificates, straight into the
      # duplicate-certificate rate limit.
      - caddy_data:/data
      - caddy_config:/config
    deploy: { resources: { limits: { memory: 128M } } }

volumes:
  caddy_data:
  caddy_config:
