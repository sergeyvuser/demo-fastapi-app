[project]
name = "ingestor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sergeyv" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "faststream[cli,rabbit]>=0.7.2",
    "loguru>=0.7.3",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[project.scripts]
ingestor = "ingestor:main"

[build-system]
# Includes the pinned uv (root required-version), so uv builds with its own
# bundled backend instead of fetching a separate uv_build from PyPI.
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
