[project]
name = "notifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sergeyv" }
]
requires-python = ">=3.14"
dependencies = [
    "faststream[cli,rabbit]>=0.7.2",
    "loguru>=0.7.3",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.0.1",
    "shared[telegram]",
]

[tool.uv.sources]
shared = { workspace = true }

[project.scripts]
notifier = "notifier:main"

[build-system]
# Includes the pinned uv (root required-version), so uv builds with its own
# bundled backend instead of fetching a separate uv_build from PyPI.
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
