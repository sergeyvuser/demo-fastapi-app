name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the previous run on the same branch — except on main,
  # where the run ends in a deploy. Cancelling that halfway leaves the stack
  # half-recreated and .env recording a failure that nobody chose.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # docker is preinstalled on ubuntu runners, so testcontainers just work;
      # Ryuk stays enabled here — it is only disabled on Windows dev machines
      - run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  build:
    needs: [ lint, types, test, secrets ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ backend, ingestor, notifier ]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ build ]
    # Pull requests never reach here: `on: push` is already limited to main, and
    # build only pushes images on a push event. So "a red check cannot deploy"
    # is enforced by the graph — needs: build, and build needs the four checks —
    # rather than by a condition someone could get wrong.
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    # Named explicitly instead of `secrets: inherit`: the called workflow gets
    # the one secret it needs, and the line documents what it can reach.
    secrets:
      ALERTS_SSH_DEPLOY_KEY: ${{ secrets.ALERTS_SSH_DEPLOY_KEY }}